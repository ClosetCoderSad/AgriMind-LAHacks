[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimind"
version = "0.1.0"
description = "Farm robot crop health pipeline using VLM + Gemma 4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "pillow>=10.3.0",
  "opencv-python>=4.10.0.84",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "transformers>=4.50.0",
  "datasets>=2.20.0",
  "accelerate>=0.33.0",
  "peft>=0.13.0",
  "bitsandbytes>=0.43.0",
  "uvicorn>=0.30.0",
  "fastapi>=0.112.0"
  ,"python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
